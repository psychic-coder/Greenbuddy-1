<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Farmer Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    /* Reset & base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
      min-height: 100vh;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }

    header {
      background: rgba(255 255 255 / 0.15);
      backdrop-filter: saturate(180%) blur(10px);
      padding: 1.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgb(0 0 0 / 0.1);
      text-align: center;
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 900px;
      user-select: none;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      max-width: 900px;
      width: 100%;
      padding: 2rem 2.5rem;
      box-shadow: 0 12px 30px rgb(0 0 0 / 0.1);
      display: flex;
      flex-direction: column;
      gap: 3rem;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    form h2 {
      font-weight: 700;
      font-size: 1.8rem;
      color: #2f6627;
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
    }

    form input,
    form select {
      font-family: inherit;
      font-size: 1rem;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      border-radius: 10px;
      border: 1.8px solid #a8d08d;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      outline-offset: 2px;
    }

    form input:focus,
    form select:focus {
      border-color: #4caf50;
      box-shadow: 0 0 8px #4caf50aa;
      outline: none;
    }

    form button {
      background-color: #4caf50;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 0.75rem 0;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 1.2px;
      transition: background-color 0.3s ease;
      box-shadow: 0 6px 12px rgb(76 175 80 / 0.5);
      user-select: none;
    }

    form button:hover {
      background-color: #3e8e41;
      box-shadow: 0 8px 20px #3e8e4180;
    }

    section h2 {
      font-weight: 700;
      font-size: 1.8rem;
      color: #2f6627;
      margin-bottom: 1rem;
      border-bottom: 2px solid #4caf50;
      padding-bottom: 0.3rem;
      letter-spacing: 1px;
    }

    .product-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.8rem;
    }

    .product-card {
      background: #ffffffdd;
      padding: 1.2rem 1.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgb(0 0 0 / 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      user-select: none;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 48px rgb(0 0 0 / 0.2);
    }

    .product-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 1rem;
      box-shadow: 0 4px 12px rgb(0 0 0 / 0.08);
      transition: transform 0.3s ease;
    }

    .product-card:hover img {
      transform: scale(1.05);
    }

    .product-card h4 {
      font-weight: 600;
      font-size: 1.3rem;
      color: #2f6627;
      margin-bottom: 0.4rem;
      text-align: center;
    }

    .product-card p {
      font-size: 0.9rem;
      color: #4a4a4a;
      line-height: 1.3;
      margin: 0.2rem 0;
      text-align: center;
      user-select: text;
    }

    /* Responsive adjustments */
    @media (max-width: 500px) {
      .container {
        padding: 1.5rem 1.7rem;
      }

      form input,
      form select,
      form button {
        font-size: 0.95rem;
        padding: 0.65rem 1rem;
      }

      .product-card img {
        height: 130px;
      }

      .product-card h4 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

<header>
  🌾 Farmer Dashboard
</header>

<div class="container">
  <form id="productForm">
    <h2>Add New Product</h2>
    <input type="text" id="name" placeholder="Product Name" required />
    <input type="text" id="type" placeholder="Type (e.g. Vegetable, Fruit)" required />
    <input type="number" id="quantity" placeholder="Quantity" required min="1" />
    <select id="unit" required>
      <option value="" disabled selected>Select Unit</option>
      <option value="kg">kg</option>
      <option value="liters">liters</option>
      <option value="pcs">pcs</option>
    </select>
    <input type="number" id="price_per_unit" placeholder="Price per Unit" required min="0" step="0.01" />
    <input type="url" id="image_url" placeholder="Image URL" required />
    <input type="text" id="farmer_id" placeholder="Farmer ID" required />
    <button type="submit">Add Product</button>
  </form>

  <section>
    <h2>My Products</h2>
    <div class="product-list" id="productList">
      <!-- Product cards appear here -->
    </div>
  </section>
</div>

<script src="farmer-dashboard.js"></script>

</body>
</html>
