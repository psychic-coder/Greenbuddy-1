<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenBuddy Map</title>
  <style>
    /* Map container fills full viewport */
    #map {
      height: 100vh;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    /* Remove body margin */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>
</head>

<body>
  <!-- Map container -->
  <div id="map"></div>

  <script>
    // Initialize and add the map
    function initMap() {
      const centerLocation = { lat: 40.7128, lng: -74.0060 }; // New York City coordinates

      // Create the map centered at centerLocation
      const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 12,
        center: centerLocation,
      });

      // Add a marker at the center location
      new google.maps.Marker({
        position: centerLocation,
        map: map,
        title: "Center Location",
      });
    }

    // Load the Google Maps API script and set the callback to initMap
    (function loadGoogleMapsAPI() {
      const script = document.createElement("script");
      script.src = "https://maps.googleapis.com/maps/api/js?key=AIzaSyDatXtdNFSyK__45S0NBUcWWCVriTIzC20&callback=initMap";
      script.async = true;
      script.defer = true;
      script.onerror = () => {
        console.error("Google Maps API failed to load.");
      };
      document.head.appendChild(script);
    })();
  </script>
</body>

</html>
